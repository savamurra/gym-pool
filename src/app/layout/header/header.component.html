<header class="header">
  <div class="header__container">

    <a href="#" class="header__logo">
      🏊 AquaGym
    </a>

    <nav class="header__nav">
      <a
        *ngFor="let link of navLinks"
        [href]="link.href"
        class="header__nav-link">
        {{ link.label }}
      </a>
    </nav>

    <div class="header__end">
      <app-theme-toggle />
      <a href="#contact" class="header__cta">
        Записаться
      </a>
      <button class="header__burger" (click)="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

  </div>
  <div class="header__mobile-menu" *ngIf="isMenuOpen()">
    <a
      *ngFor="let link of navLinks"
      [href]="link.href"
      class="header__mobile-link"
      (click)="toggleMenu()">
      {{ link.label }}
    </a>
  </div>
</header>
