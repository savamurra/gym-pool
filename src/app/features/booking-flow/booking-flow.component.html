<section class="booking-flow" id="booking">
  <div class="booking-flow__container">

    <div class="booking-flow__header" *ngIf="step() !== 'success'">
      <span class="booking-flow__badge">📅 Онлайн запись</span>
      <h2 class="booking-flow__heading">Запишитесь на занятие</h2>

      <div class="booking-flow__progress">
        <div class="booking-flow__progress-step"
             [class.booking-flow__progress-step--active]="step() === 1"
             [class.booking-flow__progress-step--done]="step() === 2 || step() === 3">
          <span class="booking-flow__progress-num">1</span>
          <span class="booking-flow__progress-label">Услуга</span>
        </div>
        <div class="booking-flow__progress-line"
             [class.booking-flow__progress-line--done]="step() === 2 || step() === 3"></div>

        <div class="booking-flow__progress-step"
             [class.booking-flow__progress-step--active]="step() === 2"
             [class.booking-flow__progress-step--done]="step() === 3">
          <span class="booking-flow__progress-num">2</span>
          <span class="booking-flow__progress-label">Время</span>
        </div>
        <div class="booking-flow__progress-line"
             [class.booking-flow__progress-line--done]="step() === 3"></div>

        <div class="booking-flow__progress-step"
             [class.booking-flow__progress-step--active]="step() === 3">
          <span class="booking-flow__progress-num">3</span>
          <span class="booking-flow__progress-label">Контакты</span>
        </div>
      </div>
    </div>

    <div class="booking-flow__content">

      <app-service-step
        *ngIf="step() === 1"
        (serviceSelected)="onServiceSelected($event)" />

      <app-calendar-step
        *ngIf="step() === 2"
        (back)="goBack()"
        (slotSelected)="onSlotSelected($event)" />

      <app-contact-step
        *ngIf="step() === 3 && selectedService() && selectedDate() && selectedTime()"
        [service]="selectedService()!"
        [date]="selectedDate()!"
        [time]="selectedTime()!"
        [isSubmitting]="isSubmitting()"
        (back)="goBack()"
        (submitted)="onContactSubmitted($event)" />

      <div class="booking-flow__success" *ngIf="step() === 'success'">
        <div class="booking-flow__success-icon">✅</div>
        <h3 class="booking-flow__success-title">Запись подтверждена!</h3>
        <p class="booking-flow__success-text">
          Мы свяжемся с вами в течение 30 минут для подтверждения деталей
        </p>
        <button class="booking-flow__success-btn" (click)="reset()">
          Записаться ещё раз
        </button>
      </div>

    </div>

  </div>
</section>
